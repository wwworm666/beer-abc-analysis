# DNS провайдера на рабочем VPS. Контейнерам нужен публичный DNS даже при потере VPN.
x-service-dns: &service-dns
  - ${BEER_DNS_PRIMARY:-188.93.16.19}
  - ${BEER_DNS_SECONDARY:-188.93.17.19}

services:
  app:
    build: .
    image: beer-abc-analysis:latest
    container_name: beer-app
    restart: unless-stopped
    env_file: .env
    network_mode: host
    dns: *service-dns
    healthcheck:
      test: ["CMD-SHELL", "getent ahostsv4 \"$${IIKO_SERVER:-first-federation.iiko.it}\" >/dev/null && curl -fsS --max-time 4 -o /dev/null http://127.0.0.1:10000/login"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      # Системный DNS отдаёт для api.telegram.org адрес 149.154.166.110,
      # который заблокирован на магистрали (ТСПУ) для датацентровых сетей;
      # 149.154.167.220 из того же пула доступен. Если Telegram перестанет
      # отвечать — проверить актуальность IP (docs/open-check-bot.md,
      # раздел "Блокировки").
      - "api.telegram.org:149.154.167.220"
    volumes:
      - /srv/kultura:/kultura
      - /srv/beer/data:/app/data
      - /srv/beer/chz_debug:/app/chz_test/debug
      # Ключ сервис-аккаунта Google для экспорта ЗП в Таблицы
      # (core/salary_gsheet.py). Только чтение; в образ ключ не пекётся и в
      # репозитории его нет — настройка в docs/guides/google-sheets-export.md.
      - /srv/beer/secrets:/app/secrets:ro
    # /app/logs не маунтим: gunicorn пишет access/error в stdout,
    # логи доступны через `docker compose logs app`. Маунт ломался
    # из-за случайно закоммиченного файла logs в репо (не папка).

  caddy:
    image: caddy:2-alpine
    container_name: beer-caddy
    restart: unless-stopped
    network_mode: host
    dns: *service-dns
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
