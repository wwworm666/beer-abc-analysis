# Temporary: wait for the fallback address to get a certificate. Runs only on this branch.
name: Site diagnostics
on:
  push:
    branches: [claude/focused-thompson-vod2vw]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Wait for HTTPS on the fallback address
        run: |
          for i in $(seq 1 16); do
            out=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.sslip.io/login 2>&1) || true
            echo "$(date -u +%H:%M:%S) attempt $i: $out"
            [ "$out" = 200 ] && break
            sleep 30
          done
          curl -sSv -o /dev/null --max-time 20 https://139-100-200-92.sslip.io/login 2>&1 | grep -Ei 'issuer:|subject:|expire date|< HTTP' || true
          echo "main domain via IP: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve beerkultura.ru:443:139.100.200.92 https://beerkultura.ru/login 2>&1)"
