# Temporary: check both fallback addresses after deploy. Runs only on this branch.
name: Site diagnostics
on:
  push:
    branches: [claude/focused-thompson-vod2vw]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Emergency address (tls internal) — proves Caddy loaded the Caddyfile
        run: |
          echo "DNS nip.io: $(dig +short 139-100-200-92.nip.io @8.8.8.8 | tr '\n' ' ')"
          for i in $(seq 1 14); do
            out=$(curl -sSk -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.nip.io/login 2>&1) || true
            echo "$(date -u +%H:%M:%S) nip attempt $i: $out"
            [ "$out" = 200 ] && break
            sleep 30
          done
          curl -sSkv -o /dev/null --max-time 20 https://139-100-200-92.nip.io/login 2>&1 | grep -Ei 'issuer:|subject:' || true
      - name: Fallback address (public CA)
        run: |
          out=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.sslip.io/login 2>&1) || true
          echo "sslip: $out"
          curl -sSv -o /dev/null --max-time 20 https://139-100-200-92.sslip.io/login 2>&1 | grep -Ei 'issuer:|subject:' || true
          echo "main domain via IP: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve beerkultura.ru:443:139.100.200.92 https://beerkultura.ru/login 2>&1)"
