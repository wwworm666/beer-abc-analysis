# Temporary: why the fallback address has no certificate. Runs only on this branch.
name: Site diagnostics
on:
  push:
    branches: [claude/focused-thompson-vod2vw]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public Suffix List
        run: |
          curl -sS --max-time 30 https://publicsuffix.org/list/public_suffix_list.dat \
            | grep -nE '^(sslip\.io|nip\.io|traefik\.me|nip\.direct|duckdns\.org|ddns\.net)$' || echo "none of them listed"
      - name: Certificates already issued for the name (crt.sh)
        run: |
          curl -sS --max-time 60 'https://crt.sh/?q=139-100-200-92.sslip.io&output=json' | head -c 1500; echo
      - name: Recent sslip.io issuance volume (crt.sh, last entries)
        run: |
          curl -sS --max-time 90 'https://crt.sh/?q=%25.sslip.io&exclude=expired&deduplicate=Y&output=json' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); d.sort(key=lambda x:x["not_before"]); print(len(d), "unexpired certs; newest:", [(x["not_before"], x["issuer_name"][:40]) for x in d[-5:]])' || true
      - name: Still failing?
        run: |
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 20 https://139-100-200-92.sslip.io/login 2>&1 || true
