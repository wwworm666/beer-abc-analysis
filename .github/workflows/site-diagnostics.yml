# Temporary: one-off check why beerkultura.ru is unreachable. Runs only on this branch.
name: Site diagnostics
on:
  push:
    branches: [claude/focused-thompson-vod2vw]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: DNS
        run: |
          for r in 8.8.8.8 1.1.1.1 77.88.8.8; do
            echo "== resolver $r"
            echo "A:  $(dig +short +time=5 A beerkultura.ru @$r | tr '\n' ' ')"
            echo "NS: $(dig +short +time=5 NS beerkultura.ru @$r | tr '\n' ' ')"
            dig +time=5 beerkultura.ru @$r | grep -E 'status:' || true
          done
          echo "== delegation from .ru"
          dig +trace +time=5 beerkultura.ru | tail -30 || true
      - name: WHOIS
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq whois >/dev/null
          whois beerkultura.ru | grep -Ei 'domain|nserver|state|org|registrar|created|paid-till|free-date' || true
      - name: Server by IP
        run: |
          for p in 22 80 443; do
            timeout 8 bash -c "</dev/tcp/139.100.200.92/$p" 2>/dev/null && echo "port $p: open" || echo "port $p: closed/timeout"
          done
          curl -sS -o /dev/null -w "https via IP (SNI beerkultura.ru): %{http_code} in %{time_total}s\n" \
            --max-time 20 --resolve beerkultura.ru:443:139.100.200.92 https://beerkultura.ru/login || true
          curl -sS -o /dev/null -w "https via DNS: %{http_code} in %{time_total}s\n" \
            --max-time 20 https://beerkultura.ru/login || true
