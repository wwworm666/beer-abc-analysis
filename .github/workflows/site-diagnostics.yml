# Temporary: confirm the fallback address after the cleanup deploy. Runs only on this branch.
name: Site diagnostics
on:
  push:
    branches: [claude/focused-thompson-vod2vw]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Wait for the cleanup deploy, then check
        run: |
          sleep 200
          for i in 1 2 3 4 5; do
            out=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.sslip.io/login 2>&1) || true
            echo "$(date -u +%H:%M:%S) sslip attempt $i: $out"
            [ "$out" = 200 ] && break
            sleep 30
          done
          curl -sSv -o /dev/null --max-time 20 https://139-100-200-92.sslip.io/login 2>&1 | grep -Ei 'issuer:|expire date' || true
          echo "nip (should be gone): $(curl -sSk -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.nip.io/login 2>&1 | tail -c 120)"
          echo "main domain via IP: $(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve beerkultura.ru:443:139.100.200.92 https://beerkultura.ru/login 2>&1)"
