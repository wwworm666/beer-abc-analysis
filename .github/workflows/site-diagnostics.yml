# Temporary: wait for a public certificate on the fallback address. Runs only on this branch.
name: Site diagnostics
on:
  push:
    branches: [claude/focused-thompson-vod2vw]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fallback address (public CA)
        run: |
          for i in $(seq 1 18); do
            out=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.sslip.io/login 2>&1) || true
            echo "$(date -u +%H:%M:%S) sslip attempt $i: $out"
            [ "$out" = 200 ] && break
            sleep 30
          done
          curl -sSv -o /dev/null --max-time 20 https://139-100-200-92.sslip.io/login 2>&1 | grep -Ei 'issuer:|subject:|expire date' || true
          echo "nip (tls internal): $(curl -sSk -o /dev/null -w '%{http_code}' --max-time 20 https://139-100-200-92.nip.io/login 2>&1)"
