name: Deploy production
run-name: Deploy ${{ github.sha }} by @${{ github.actor }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a deployment in progress. The server also holds a flock.
concurrency:
  group: beer-production
  cancel-in-progress: false

jobs:
  test:
    name: Test release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Python tests
        # debug/ contains manual iiko probes with non-pytest arguments.
        run: python -m pytest -q tests --ignore=tests/debug
      - name: Deploy script checks
        run: |
          bash -n scripts/deploy/beer-deploy.sh scripts/deploy/install.sh
          python -m pytest -q scripts/deploy/test_deploy.py
      - name: JavaScript syntax
        run: node --check static/js/me/snapshot.js

  deploy:
    name: Update beerkultura.ru
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Deploy tested commit through restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.BEER_DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.BEER_DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_KEY" || -z "$DEPLOY_HOST_KEYS" ]]; then
            echo '::error::One-time setup required: install scripts/deploy/install.sh on the VPS and add BEER_DEPLOY_SSH_KEY and BEER_DEPLOY_KNOWN_HOSTS in repository Actions secrets.'
            exit 1
          fi
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/beer-ssh.XXXXXX")
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_HOST_KEYS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            root@139.100.200.92 "deploy $RELEASE_SHA"
          printf '### Deployed\n\nCommit: `%s`\n\n[Open site](https://beerkultura.ru)\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
