<!-- Вкладка "Сравнение периодов" — Modern Fintech Design -->

<div class="comparison-container">
    <!-- Периоды сравнения (стандарт периодов, раздел 8): период 1 — из шапки страницы,
         период 2 — прошлый период, тот же период год назад или свой. Сравнение запускается само. -->
    <div class="cmp-controls">
        <div class="cmp-line">
            <span class="cmp-label">Период 1</span>
            <span class="cmp-value" id="cmp-p1">—</span>
            <span class="cmp-hint">выбирается в шапке страницы</span>
        </div>
        <div class="cmp-line">
            <span class="cmp-label">Сравнить с</span>
            <div class="comparison-mode-tabs">
                <button type="button" class="comparison-mode-tab active" data-mode="prev">Прошлым периодом</button>
                <button type="button" class="comparison-mode-tab" data-mode="year">Тем же периодом год назад</button>
                <button type="button" class="comparison-mode-tab" data-mode="custom">Своим периодом</button>
            </div>
        </div>
        <div class="cmp-line">
            <span class="cmp-label">Период 2</span>
            <span class="cmp-value" id="cmp-p2">—</span>
            <div class="cmp-p2-picker" id="cmp-p2-picker" hidden></div>
        </div>
        <div class="cmp-note" id="cmp-note" hidden></div>
    </div>

    <!-- Loading State -->
    <div id="comparison-loading" class="loading-container hidden">
        <div class="loading-spinner"></div>
        <span class="loading-text">Загрузка данных...</span>
    </div>

    <!-- Empty State -->
    <div id="comparison-empty" class="no-data-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <h3>Сравнение периодов</h3>
        <p>Период 1 — из шапки страницы. Выберите, с чем сравнить.</p>
    </div>

    <!-- Results Container -->
    <div id="comparison-results" class="comparison-results hidden">

        <!-- Top 3 Changes Panel -->
        <div class="comparison-top-changes">
            <div class="comparison-top-changes-header">
                <div class="comparison-top-changes-title">Топ-3 изменения</div>
                <div class="comparison-top-changes-subtitle">Метрики с наибольшими отклонениями</div>
            </div>
            <div id="comparison-top-changes-list" class="comparison-top-changes-list">
                <!-- Заполняется через JS -->
            </div>
        </div>

        <!-- Metric Cards Grid -->
        <div id="comparison-metrics-grid" class="comparison-metrics-grid">
            <!-- Заполняется через JS -->
        </div>

        <!-- Detailed Comparison Table -->
        <div class="comparison-table-section">
            <div class="comparison-table-header">
                <div class="comparison-table-title">Детальное сравнение</div>
                <button id="btn-export-comparison" class="btn btn-secondary">
                    Экспорт
                </button>
            </div>
            <div class="table-wrapper">
                <table class="comparison-table">
                    <thead>
                        <tr>
                            <th>Метрика</th>
                            <th>Период 1</th>
                            <th>Период 2</th>
                            <th>Δ</th>
                            <th>Δ%</th>
                            <th>Тренд</th>
                        </tr>
                    </thead>
                    <tbody id="comparison-table-body">
                        <!-- Заполняется через JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
