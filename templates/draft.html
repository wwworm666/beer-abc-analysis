<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проливы разливного пива</title>
    <!-- Shared CSS -->
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css">
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css">
    <link rel="stylesheet" href="/static/logo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/ru.js"></script>
    <style>
        /* Card */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 4px 12px var(--shadow);
            transform: translateY(-2px);
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select, input {
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        /* Button */
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: auto;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 60px 32px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .loading p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Tabs: вид повторяет вкладки «Маркетинга» (static/guests/guests.css),
           скопирован сюда, потому что draft.html не подключает guests.css */
        .draft-tabs {
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            margin: 6px 0 18px;
        }

        .draft-tabs.active {
            display: flex;
        }

        .dtab-btn {
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
            cursor: pointer;
            padding: 9px 16px;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.15s ease;
        }

        .dtab-btn:hover {
            color: var(--text-primary);
            border-color: var(--text-tertiary);
        }

        .dtab-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }

        .dtab-pane {
            display: none;
        }

        .dtab-pane.active {
            display: block;
        }

        /* Results */
        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            border-color: var(--accent);
        }

        .stat-card .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .stat-card .unit {
            font-size: 1rem;
            color: var(--text-tertiary);
            margin-left: 4px;
        }

        /* Section Title */
        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 40px 0 20px 0;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        thead {
            border-bottom: 2px solid var(--border-color);
        }

        th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .beer-row {
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .beer-row:hover {
            background: var(--bg-tertiary);
        }

        /* Error */
        .error {
            background: var(--danger);
            color: white;
            padding: 16px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .error.active {
            display: block;
        }

        /* Badge для ABC */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .badge.abc-a {
            background: var(--success);
            color: white;
        }

        .badge.abc-b {
            background: var(--warning);
            color: white;
        }

        .badge.abc-c {
            background: var(--danger);
            color: white;
        }

        /* XYZ badges */
        .badge.xyz-x {
            background: #10b981;
            color: white;
        }

        .badge.xyz-y {
            background: #f59e0b;
            color: white;
        }

        .badge.xyz-z {
            background: #6b7280;
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
            transition: color 0.2s ease;
            padding: 0;
            width: 32px;
            height: 32px;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-item {
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 6px;
        }

        .detail-item .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .detail-item .value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Баланс кегов (блок потерь) */
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 0;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 0.95rem;
        }

        .balance-grid > div {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .balance-grid .v {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            padding-left: 24px;
        }

        .balance-grid .pct {
            text-align: right;
            padding-left: 16px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            font-size: 0.85rem;
        }

        .balance-grid .total {
            border-bottom: none;
            font-weight: 700;
        }

        .balance-grid .total ~ div { border-bottom: none; }

        .hint {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            margin: 8px 0 0 0;
        }

        .dash { color: var(--text-tertiary); }

        th[title], td[title] { cursor: help; }

        input[readonly] { cursor: pointer; }
        .flatpickr-calendar { border-radius: 6px; border: 1px solid var(--border-color); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
        [data-theme="dark"] .flatpickr-calendar { background: var(--bg-secondary); border-color: var(--border-color); }
        [data-theme="dark"] .flatpickr-months, [data-theme="dark"] .flatpickr-weekdays, [data-theme="dark"] .flatpickr-month { background: var(--bg-secondary); }
        [data-theme="dark"] .flatpickr-current-month .flatpickr-monthDropdown-months, [data-theme="dark"] .flatpickr-current-month input.cur-year, [data-theme="dark"] .flatpickr-weekday, [data-theme="dark"] .flatpickr-month .flatpickr-prev-month, [data-theme="dark"] .flatpickr-month .flatpickr-next-month { color: var(--text-primary); fill: var(--text-primary); }
        [data-theme="dark"] .flatpickr-day { color: var(--text-primary); }
        [data-theme="dark"] .flatpickr-day:hover { background: var(--bg-tertiary); border-color: var(--bg-tertiary); }
        .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange { background: var(--accent) !important; border-color: var(--accent) !important; }
        .flatpickr-day.inRange { background: rgba(217,119,87,0.15) !important; border-color: transparent !important; box-shadow: -5px 0 0 rgba(217,119,87,0.15), 5px 0 0 rgba(217,119,87,0.15); }
        [data-theme="dark"] .flatpickr-day.inRange { background: rgba(217,119,87,0.25) !important; box-shadow: -5px 0 0 rgba(217,119,87,0.25), 5px 0 0 rgba(217,119,87,0.25); }

        /* Responsive - Tablet */
        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Responsive - Mobile */
        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            /* Cards */
            .card {
                padding: 20px 16px;
                overflow-x: auto;
            }

            /* Tables */
            table {
                min-width: 700px;
                font-size: 0.8rem;
            }

            th, td {
                padding: 10px 8px;
            }

            /* Modal */
            .modal-content {
                padding: 20px;
                max-width: 95%;
            }

            .modal-header h2 {
                font-size: 1.2rem;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            /* Stats */
            .stat-card .value {
                font-size: 1.5rem;
            }
        }

        /* Extra small screens */
        @media (max-width: 480px) {
            .stat-card .value {
                font-size: 1.25rem;
            }

            table {
                min-width: 600px;
                font-size: 0.75rem;
            }

            th, td {
                padding: 8px 6px;
            }

            .badge {
                padding: 3px 8px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        {% set page_title = "Анализ проливов" %}
        {% set page_subtitle = "Контроль потерь разливного пива" %}
        {% include 'shared/nav.html' %}

        <div class="card">
            <div class="controls">
                <div class="form-group">
                    <label for="bar-select">Бар</label>
                    <select id="bar-select">
                        <option value="">Общая</option>
                        {% for bar in bars %}
                        <option value="{{ bar }}">{{ bar }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date-range">Период</label>
                    <input type="text" id="date-range" placeholder="Выберите период" readonly>
                </div>

                <div class="form-group">
                    <label>&nbsp;</label>
                    <button class="btn" onclick="runAnalysis()">Запустить анализ</button>
                </div>
            </div>
        </div>

        <div class="error" id="error-message"></div>

        <div class="card loading" id="loading">
            <div class="spinner"></div>
            <h2>Загружаем проливы...</h2>
            <p>Это может занять несколько секунд</p>
        </div>

        <div class="draft-tabs" id="draft-tabs">
            <button class="dtab-btn active" data-tab="kegs">По кегам</button>
            <button class="dtab-btn" data-tab="bartenders">По барменам</button>
        </div>

        <div class="results" id="results">
            <div class="dtab-pane active" id="pane-kegs"></div>
            <div class="dtab-pane" id="pane-bartenders"></div>
        </div>
    </div>

    <script>
        let currentData = {};
        // Строки текущей выдачи: клик по строке передаёт индекс, а не JSON в атрибуте.
        // Раньше в onclick подставлялся JSON.stringify, и апостроф в названии
        // («Gravity It's Mango») закрывал атрибут и ломал обработчик.
        let currentRows = [];
        let currentBartenders = [];
        // Активная вкладка живёт в hash: /draft#bartenders открывается сразу на барменах
        // (туда же ведёт 301 со старого /waiters).
        let activeTab = 'kegs';

        // API Connection Status Check
        window.dashboardCheckApi = async function() {
            const statusElement = document.getElementById('api-status');
            if (!statusElement) return;
            const textElement = statusElement.querySelector('.api-status-text');

            statusElement.className = 'api-status checking';
            textElement.textContent = 'Проверка подключения...';

            try {
                const response = await fetch('/api/connection-status');
                const data = await response.json();

                if (response.ok && data.status === 'connected') {
                    statusElement.className = 'api-status connected';
                    textElement.textContent = 'iiko API подключен';
                } else {
                    statusElement.className = 'api-status error';
                    textElement.textContent = 'Ошибка подключения';
                    console.error('API connection error:', data.message);
                }
            } catch (error) {
                statusElement.className = 'api-status error';
                textElement.textContent = 'Ошибка подключения';
                console.error('API connection error:', error);
            }
        };

        // Check connection on page load
        document.addEventListener('DOMContentLoaded', function() {
            window.dashboardCheckApi();
            setInterval(window.dashboardCheckApi, 60000);
            initDatePicker();
            initTabs();
        });

        function initTabs() {
            document.querySelectorAll('.dtab-btn').forEach(function(button) {
                button.addEventListener('click', function() {
                    activateTab(button.dataset.tab);
                });
            });
            activateTab(tabFromHash());
        }

        function tabFromHash() {
            const hash = (location.hash || '').replace('#', '');
            return hash === 'bartenders' ? 'bartenders' : 'kegs';
        }

        function activateTab(tab) {
            activeTab = tab === 'bartenders' ? 'bartenders' : 'kegs';
            document.querySelectorAll('.dtab-btn').forEach(function(button) {
                button.classList.toggle('active', button.dataset.tab === activeTab);
            });
            document.querySelectorAll('.dtab-pane').forEach(function(pane) {
                pane.classList.toggle('active', pane.id === 'pane-' + activeTab);
            });
            // Ссылку на вкладку можно скинуть коллеге; запроса переключение не делает —
            // обе картины приходят одним ответом.
            if (history.replaceState) history.replaceState(null, '', '#' + activeTab);
        }

        let datePicker = null;

        function initDatePicker() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const dayOfWeek = today.getDay();
            const daysFromMonday = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
            const lastMonday = new Date(today);
            lastMonday.setDate(today.getDate() - daysFromMonday - 7);
            const lastSunday = new Date(lastMonday);
            lastSunday.setDate(lastMonday.getDate() + 6);

            datePicker = flatpickr('#date-range', {
                mode: 'range',
                dateFormat: 'd.m.Y',
                locale: 'ru',
                maxDate: new Date(2026, 11, 31),  // Date-объект: строку Flatpickr парсил форматом d.m.Y -> упор в 20-е число
                defaultDate: [lastMonday, lastSunday]
            });
        }

        function getPickerDates() {
            if (!datePicker || !datePicker.selectedDates || datePicker.selectedDates.length < 2) return null;
            const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            return { from: fmt(datePicker.selectedDates[0]), to: fmt(datePicker.selectedDates[1]) };
        }

        async function runAnalysis() {
            const bar = document.getElementById('bar-select').value;
            const dates = getPickerDates();

            if (!dates) {
                showError('Пожалуйста, выберите период');
                return;
            }

            const dateFrom = dates.from;
            const dateTo = dates.to;
            const from = new Date(dateFrom);
            const to = new Date(dateTo);
            const days = Math.ceil((to - from) / (1000 * 60 * 60 * 24));

            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('error-message').classList.remove('active');

            try {
                const requestBody = { bar, days };
                if (dateFrom && dateTo) {
                    requestBody.date_from = dateFrom;
                    requestBody.date_to = dateTo;
                }

                const response = await fetch('/api/draft-kegs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (!response.ok) {
                    // Сервер присылает причину («Нет данных за выбранный период») —
                    // показываем её, а не общее «ошибка при получении данных».
                    throw new Error(data && data.error ? data.error : 'HTTP ' + response.status);
                }

                currentData = data;
                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                showError(error.message);
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        function displayResults(data) {
            const kegsPane = document.getElementById('pane-kegs');
            const bartendersPane = document.getElementById('pane-bartenders');
            kegsPane.innerHTML = '';
            bartendersPane.innerHTML = '';
            currentRows = [];
            currentBartenders = [];

            const entries = Object.entries(data || {});
            if (!entries.length) {
                showError('За выбранный период движения кегов не было');
                return;
            }

            for (const [barName, barData] of entries) {
                kegsPane.appendChild(createBarSection(barName, barData));
                bartendersPane.appendChild(createBartenderSection(barName, barData));
            }

            document.getElementById('draft-tabs').classList.add('active');
            document.getElementById('results').classList.add('active');
            activateTab(activeTab);
        }

        function createBarSection(barName, data) {
            const section = document.createElement('div');
            section.className = 'bar-section';

            const card = document.createElement('div');
            card.className = 'card';

            const p = data.period || {};
            const header = `
                <div class="bar-header">
                    <h2>${escapeHtml(barName)}</h2>
                    <p class="hint">Литры — расход кегов со склада по данным iiko
                    (списание по техкарте при продаже), период ${p.from} — ${p.to},
                    ${p.days} дн.</p>
                </div>
            `;

            const markup = data.markup_percent === null || data.markup_percent === undefined
                ? '<span class="dash">—</span>'
                : formatPercent(data.markup_percent, 1);

            const stats = `
                <div class="stats-grid">
                    <div class="stat-card" title="Сумма расхода кегов по проводкам списания при продаже">
                        <div class="label">Продано</div>
                        <div class="value">${formatAmount(data.total_liters)}<span class="unit">л</span></div>
                    </div>
                    <div class="stat-card" title="Выручка со скидками / литры">
                        <div class="label">Средняя цена за литр</div>
                        <div class="value">${formatMoney(data.avg_price_per_liter)}</div>
                    </div>
                    <div class="stat-card" title="Литры / порции">
                        <div class="label">Средний объём порции</div>
                        <div class="value">${data.avg_portion_liters.toFixed(3)}<span class="unit">л</span></div>
                    </div>
                    <div class="stat-card" title="Количество проданных порций из отчёта по продажам">

        function renderBartenderNotes(notes) {
            const parts = [];
            // Литры, под которые не нашлось строки продаж: в норме ноль, поэтому молчим,
            // пока ноль, и говорим прямо, когда нет.
            if (Math.abs(notes.unassigned_liters || 0) > 0.01) {
                parts.push(`Не отнесено ни к одному бармену:
                    ${formatAmount(notes.unassigned_liters)} л — списание кега есть,
                    а строки продаж под него нет (граница учётного дня).`);
            }
            if ((notes.dishes_without_volume || []).length) {
                parts.push(`Позиции без нормы закладки в техкарте, их литры разошлись по
                    остальным блюдам того же кега:
                    ${notes.dishes_without_volume.map(d => escapeHtml(d.DishName) +
                        ' (' + formatAmount(d.Portions) + ' порц.)').join(', ')}`);
            }
            if (notes.kegs_scaled) {
                parts.push(`Кегов, где техкарта разошлась с фактом списания больше чем на 1%:
                    ${notes.kegs_scaled}; максимальное расхождение
                    ${formatPercent(notes.max_factor_deviation_percent, 1)} — на столько
                    масштабировались литры этого кега.`);
            }
            return parts.map(text => `<p class="hint">${text}</p>`).join('');
        }

                <div class="${cls || ''}" title="${hint || ''}">${label}</div>

                <div class="pct ${cls || ''}">${percent || ''}</div>
            `;

                <h3 class="section-title">Баланс кегов за период (литры)</h3>
                <div class="balance-grid">
                    ${row('Приход по накладным', L.invoice_in, 'Проводки INVOICE: сколько кегов пришло на склады')}
                    ${L.transfer_in ? row('Перемещения между барами, приход', L.transfer_in, 'Проводки TRANSFER') : ''}
                    ${row('Продано через кассу', -sold, 'Проводки SESSION_WRITEOFF: списание кега по техкарте')}
                    ${row('Списано актами', -(L.writeoff || 0),
                          'Проводки WRITEOFF. Совпадает с объёмом позиций, удалённых «со списанием»: пиво налито, позиция удалена',
                          sold ? formatPercent(L.writeoff_percent_of_sold, 2) + ' от продаж' : '')}
                    ${row('Недостача по инвентаризациям', -(L.inventory_net || 0),

                          sold ? formatPercent(L.inventory_percent_of_sold, 2) + ' от продаж' : '')}
                    ${L.transfer_out ? row('Перемещения между барами, расход', -(L.transfer_out || 0), 'Проводки TRANSFER') : ''}
                    ${row('Изменение остатка кегов', L.balance,

                                    </span>
                                    <div style="font-size: 0.9rem; color: var(--text-secondary);">
                                        Коэффициент вариации ${formatPercent(keg.CoefficientOfVariation, 1)}
                                        по ${keg.WeeksWithSales} нед. с продажами
                                    </div>
                                </div>
                                <div style="font-size: 0.9rem;">
                                    ${keg.XYZ_Category === 'X' ? 'Недельный объём предсказуем: разброс до 30%.' :
                                      keg.XYZ_Category === 'Y' ? 'Умеренный разброс: от 30% до 60% недельного объёма.' :
                                      'Разброс свыше 60%: недельный объём может отличаться больше чем в полтора раза.'}
                                </div>
                            ` : `
                                <div style="font-size: 0.9rem; color: var(--text-secondary);">
                                    Категория не присвоена: ${keg.WeeksWithSales < 3
                                        ? `позиция была на кране ${keg.WeeksWithSales} нед. из ${keg.WeeksInPeriod}, для оценки стабильности нужно минимум 3`
                                        : 'в периоде меньше 3 полных недель'}.
                                </div>
                            `}
                            <p class="hint">Считается по неделям, когда позиция стояла на кране:
                            стандартное отклонение недельных литров делится на среднее.</p>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }

        function closeModalBackdrop(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        }

        function closeModal() {
            // Одно окно на обе вкладки: карточка кега и карточка бармена рисуются
            // одним и тем же id, поэтому закрытие и Escape общие.
            const modal = document.getElementById('detail-modal');
            if (modal) {
                modal.remove();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function formatMoney(value) {
            return new Intl.NumberFormat('ru-RU', {
                style: 'currency',
                currency: 'RUB',
                maximumFractionDigits: 0
            }).format(value || 0);
        }

        function formatNumber(value) {
            return new Intl.NumberFormat('ru-RU').format(value || 0);
        }

        // Литры и порции бывают дробными (порция 0,33 в данных встречается),
        // поэтому дробную часть не отрезаем, но и не рисуем нули у целых.
        function formatAmount(value) {
            const rounded = Math.round((value || 0) * 100) / 100;
            return new Intl.NumberFormat('ru-RU', {
                maximumFractionDigits: Number.isInteger(rounded) ? 0 : 2
            }).format(rounded);
        }

        function formatPercent(value, digits) {
            if (value === null || value === undefined) return '—';
            return new Intl.NumberFormat('ru-RU', {
                minimumFractionDigits: digits,
                maximumFractionDigits: digits
            }).format(value) + '%';
        }

        function formatSigned(value) {
            const v = value || 0;
            const text = formatAmount(Math.abs(v));
            if (v > 0) return '+' + text;
            if (v < 0) return '−' + text;
            return text;
        }

        // Названия кегов приходят из iiko и могут содержать кавычки и угловые скобки.
        function escapeHtml(text) {
            return String(text === null || text === undefined ? '' : text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }
    </script>
    <script src="/static/logo.js"></script>
</body>
</html>
