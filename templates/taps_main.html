<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Краны — Пивная культура</title>
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css">
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css">
    <link rel="stylesheet" href="/static/logo.css">
    <link rel="stylesheet" href="/static/taps/taps.css?v={{ app_version }}">
</head>
<body class="tp-page tp-scope">
    <div class="container">
        {% set page_title = "Краны" %}
        {% set page_subtitle = "Что стоит на кранах в барах" %}
        {% include 'shared/nav.html' %}

        <div class="tp">
            <div class="tp-top">
                <nav class="tp-bars" aria-label="Раздел">
                    <a class="tp-bar" href="/taps" aria-current="page">Бары</a>
                    <a class="tp-bar" href="/taps/untappd" id="tp-untappd-link">Связи с Untappd<span class="tp-bar-count" id="tp-untappd-count" hidden></span></a>
                </nav>
            </div>
            <div class="tp-bars-grid">
                {% for bar in bars %}
                <a class="tp-panel tp-barcard" href="/taps/{{ bar.id }}" data-bar="{{ bar.id }}" data-taps="{{ bar.taps }}">
                    <h2>{{ bar.name }}</h2>
                    <div class="tp-meter" aria-hidden="true"><span style="width: 0%"></span></div>
                    <div class="tp-barcard-row"><span>Активных</span><b data-field="active">—</b></div>
                    <div class="tp-barcard-row"><span>Пустых</span><b data-field="empty">—</b></div>
                    <div class="tp-barcard-row" data-row="unverified" hidden><span>Без карточки Untappd</span><b data-field="unverified">—</b></div>
                    <div class="tp-barcard-row" title="Доля кран-дней с подключённой кегой за последние 7 дней, включая сегодня">
                        <span>Активность за 7 дней</span><b data-field="activity">—</b>
                    </div>
                    <div class="tp-barcard-foot">Открыть краны</div>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
    <script src="/static/logo.js"></script>
    <script>
        /* /taps: состояние кранов по барам из /api/taps/<bar>/stats (routes/taps.py). */
        (function () {
            'use strict';
            async function load(card) {
                const total = Number(card.dataset.taps);
                const set = (field, value) => { card.querySelector('[data-field="' + field + '"]').textContent = value; };
                try {
                    const response = await fetch('/api/taps/' + encodeURIComponent(card.dataset.bar) + '/stats', { cache: 'no-store' });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'нет данных');
                    set('active', data.active + ' из ' + (data.total || total));
                    set('empty', String(data.empty));
                    set('activity', data.activity_7d.toFixed(1).replace('.', ',') + '%');
                    card.querySelector('.tp-meter span').style.width = Math.round(data.active / (data.total || total) * 100) + '%';
                    const row = card.querySelector('[data-row="unverified"]');
                    row.hidden = !data.unverified;
                    row.classList.toggle('is-warn', data.unverified > 0);
                    set('unverified', String(data.unverified || 0));
                } catch (error) {
                    set('active', 'не загрузилось');
                }
            }
            /* Сколько предложений ИИ-агента ждут решения на /taps/untappd. */
            async function loadLinks() {
                const badge = document.getElementById('tp-untappd-count');
                try {
                    const response = await fetch('/api/untappd/proposals?status=proposed&limit=1', { cache: 'no-store' });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'нет данных');
                    const count = (data.counts && data.counts.proposed) || 0;
                    badge.textContent = String(count);
                    badge.hidden = !count;
                    badge.title = 'Ждут решения: ' + count;
                } catch (error) {
                    badge.hidden = true;
                }
            }
            function loadAll() {
                if (document.visibilityState !== 'visible') return;
                document.querySelectorAll('.tp-barcard').forEach(load);
                loadLinks();
            }
            loadAll();
            setInterval(loadAll, 60000);
            document.addEventListener('visibilitychange', loadAll);
        })();
    </script>
</body>
</html>
