<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чистота — Пивная культура</title>
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css">
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css">
    <link rel="stylesheet" href="/static/logo.css">
    <link rel="stylesheet" href="/static/cleanliness/cleanliness.css?v={{ app_version }}">
</head>
<body>
    <div class="container">
        {% set page_title = "Чистота" %}
        {% set page_subtitle = "Приёмка бара" %}
        {% include 'shared/nav.html' %}

        <div class="cl-wrap">

            <!-- Месяц. Стрелки, а не выпадающий список: журнал читают подряд,
                 «а что было в прошлом месяце» — это один щелчок назад. -->
            <div class="cl-head">
                <div class="cl-month">
                    <button type="button" class="cl-nav" id="clPrev" aria-label="Предыдущий месяц">&lsaquo;</button>
                    <span class="cl-month-t" id="clMonthLabel">&nbsp;</span>
                    <button type="button" class="cl-nav" id="clNext" aria-label="Следующий месяц">&rsaquo;</button>
                </div>
                <div class="cl-rule" id="clRule"></div>
            </div>

            <!-- Итоги месяца. «Не отмечено» стоит последним и выделено: это
                 единственная плитка про пробел, а пробел важнее любого ответа —
                 день, про который не известно ничего. -->
            <div class="cl-tiles" id="clTiles"></div>

            <div class="cl-filters">
                <select id="clVenue" class="cl-sel"><option value="">Все точки</option></select>
                <select id="clStatus" class="cl-sel">
                    <option value="">Все ответы</option>
                    <option value="clean">Чисто</option>
                    <option value="issues">Замечания</option>
                    <option value="bad">Плохо</option>
                    <option value="not_marked">Не отмечено</option>
                </select>
                <input type="text" id="clSearch" class="cl-search" autocomplete="off"
                       placeholder="Поиск по бармену или тексту">
                <span class="cl-count" id="clCount"></span>
            </div>

            <div id="clNotice"></div>
            <div class="cl-table-wrap">
                <table class="cl-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Точка</th>
                            <th>Бармен</th>
                            <th>Ответ</th>
                            <th>Что не так</th>
                            <th>Фото</th>
                        </tr>
                    </thead>
                    <tbody id="clRows"></tbody>
                </table>
            </div>

            <p class="cl-note" id="clFoot"></p>
        </div>
    </div>

    <!-- Просмотр фото во весь экран: в таблице превью 44 px, а разбираются
         именно по фотографии. -->
    <div class="cl-lightbox" id="clLightbox" hidden>
        <button type="button" class="cl-lb-x" id="clLbClose" aria-label="Закрыть">&times;</button>
        <img id="clLbImg" alt="Фото приёмки">
        <div class="cl-lb-cap" id="clLbCap"></div>
    </div>

    <div class="toast" id="clToast"></div>

    <script src="/static/js/cleanliness/view.js?v={{ app_version }}"></script>
    <script src="/static/logo.js"></script>
</body>
</html>
