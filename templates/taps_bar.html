<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Краны — {{ bar_name }} — Пивная культура</title>
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css">
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css">
    <link rel="stylesheet" href="/static/logo.css">
    <link rel="stylesheet" href="/static/taps/taps.css?v={{ app_version }}">
</head>
<body class="tp-page tp-scope">
    <div class="container">
        {% set page_title = "Краны" %}
        {% set page_subtitle = bar_name %}
        {% include 'shared/nav.html' %}

        <div class="tp" id="tp" data-bar="{{ bar_id }}" data-bar-name="{{ bar_name }}" data-taps="{{ tap_count }}">
            <div class="tp-top">
                <nav class="tp-bars" aria-label="Бар">
                    {% for bar in bars %}
                    <a class="tp-bar" href="/taps/{{ bar.id }}"{% if bar.id == bar_id %} aria-current="page"{% endif %}>{{ bar.name }}</a>
                    {% endfor %}
                </nav>
                <div class="tp-top-actions">
                    <button class="tp-btn tp-btn-sm" id="tp-csv" type="button"
                            title="Таплист бара: цены и порции из iiko, пивоварня, фото и описание">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                        Таплист CSV
                    </button>
                    <button class="tp-btn tp-btn-sm" id="tp-refresh-kegs" type="button"
                            title="Забрать свежий список кег из iiko, если нужной нет в поиске">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                        Список кег из iiko
                    </button>
                </div>
            </div>

            <section class="tp-panel tp-strip" id="tp-strip" aria-live="polite"></section>

            <div class="tp-tools">
                <label class="tp-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="tp-filter" placeholder="Номер крана или сорт" aria-label="Найти кран или сорт" autocomplete="off">
                </label>
                <div class="tp-chips" id="tp-chips" role="group" aria-label="Показать"></div>
            </div>

            <p class="tp-note is-bad" id="tp-error" role="alert" hidden></p>
            <div class="tp-grid" id="tp-grid" aria-label="Краны"></div>

            <section class="tp-panel tp-history" aria-label="История">
                <div class="tp-history-head">
                    <h2>История</h2>
                    <span id="tp-history-count"></span>
                </div>
                <div id="tp-history"></div>
                <div class="tp-history-more" id="tp-history-more" hidden>
                    <button class="tp-link-btn" type="button" id="tp-history-more-btn">Показать ещё</button>
                </div>
            </section>
        </div>

        <div class="tp-sheet-wrap" id="tp-sheet-wrap" hidden>
            <div class="tp-sheet" role="dialog" aria-modal="true" aria-labelledby="tp-sheet-title">
                <div class="tp-sheet-head">
                    <h2 id="tp-sheet-title"></h2>
                    <span class="tp-status" id="tp-sheet-status"></span>
                    <button class="tp-sheet-close" id="tp-sheet-close" type="button" aria-label="Закрыть">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                    </button>
                </div>
                <div class="tp-sheet-body" id="tp-sheet-body"></div>
            </div>
        </div>
        <div class="tp-toast" id="tp-toast" role="status" aria-live="polite" hidden></div>
    </div>
    <script src="/static/logo.js"></script>
    <script src="/static/js/taps/bar.js?v={{ app_version }}"></script>
</body>
</html>
