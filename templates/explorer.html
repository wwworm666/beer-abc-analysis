<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор отчётов — Пивная культура</title>
    <!-- Конструктор OLAP-отчётов iiko (docs/explorer.md). Стили — explorer.css (классы ex-*,
         токены --ex-* на body.explorer-page). draft.css подключён ради @font-face
         IBM Plex Sans: объявление живёт там (так же у /kitchen и /packaging). -->
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css">
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css">
    <link rel="stylesheet" href="/static/logo.css">
    <link rel="stylesheet" href="/static/draft/draft.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/explorer/explorer.css?v={{ app_version }}">
</head>
<body class="explorer-page">
    <div class="container">
        {% set page_title = "Конструктор отчётов" %}
        {% set page_subtitle = "OLAP-отчёты iiko" %}
        {% include 'shared/nav.html' %}
    </div>

    <div class="ex-wrap">

      <header class="ex-head">
        <button type="button" class="ex-burger" id="exBurger" aria-label="Меню">
          <span></span><span></span><span></span>
        </button>
        <span class="ex-title">
          <span class="ex-title-n">Конструктор отчётов</span>
          <span class="ex-title-s">OLAP-отчёты iiko: любые поля в строки и столбцы, фильтры, итоги</span>
        </span>
        <span class="ex-logo"><i>&gt;&nbsp;</i>k<span class="ex-logo-tail">ultura.os</span><b>_</b></span>
      </header>

      <!-- Перехватчик клика мимо открытого меню. -->
      <div class="ex-catch" id="exCatch" hidden></div>

      <div class="ex-bar">
        <div class="ex-pick">
          <button type="button" class="ex-pick-btn" id="exTypeBtn" aria-haspopup="listbox">
            <span class="ex-pick-cap">ОТЧЁТ</span>
            <span class="ex-pick-val">
              <span id="exTypeLabel">Продажи</span>
              <svg class="ex-chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M2 3.5 5 6.5 8 3.5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          <div class="ex-menu" id="exTypeMenu" role="listbox" hidden></div>
        </div>

        <span class="ex-sep"></span>

        <div class="ex-pick">
          <button type="button" class="ex-pick-btn" id="exPerBtn" aria-haspopup="listbox">
            <span class="ex-pick-cap">ПЕРИОД</span>
            <span class="ex-pick-val">
              <span id="exPerLabel">Прошлая неделя</span>
              <span class="ex-pick-hint" id="exPerHint"></span>
              <svg class="ex-chev" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M2 3.5 5 6.5 8 3.5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </button>
          <div class="ex-menu" id="exPerMenu" role="listbox" hidden></div>
        </div>

        <span class="ex-grow"></span>

        <div class="ex-actions">
          <button type="button" class="ex-btn" id="exOpenBtn">Открыть</button>
          <button type="button" class="ex-btn" id="exSaveBtn">Сохранить</button>
          <button type="button" class="ex-btn" id="exExcelBtn">Excel</button>
        </div>
        <div class="ex-run-wrap">
          <button type="button" class="ex-run" id="exRun">
            <span class="ex-spin" id="exSpin" hidden></span>
            <span id="exRunLabel">Построить</span>
          </button>
        </div>
      </div>

      <div class="ex-context" id="exContext"></div>

      <div class="ex-layout">
        <aside class="ex-fields ex-card" id="exFields" aria-label="Поля отчёта">
          <div class="ex-fields-head">
            <span class="ex-cap">ПОЛЯ</span>
            <span class="ex-fields-src" id="exFieldsSrc"></span>
            <button type="button" class="ex-x ex-fields-close" id="exFieldsClose" aria-label="Закрыть">×</button>
          </div>
          <input type="search" class="ex-search" id="exFieldSearch" placeholder="найти поле…"
                 autocomplete="off" aria-label="Поиск поля">
          <div class="ex-fields-list" id="exFieldList"></div>
        </aside>

        <section class="ex-main">
          <div class="ex-zones">
            <div class="ex-zone ex-card" data-zone="rows">
              <div class="ex-zone-h"><span class="ex-cap">СТРОКИ</span>
                <button type="button" class="ex-btn ex-zone-add" data-add="rows">+ поле</button>
                <span class="ex-zone-n" data-count="rows"></span></div>
              <div class="ex-zone-body" data-body="rows"></div>
            </div>
            <div class="ex-zone ex-card" data-zone="columns">
              <div class="ex-zone-h"><span class="ex-cap">СТОЛБЦЫ</span>
                <button type="button" class="ex-btn ex-zone-add" data-add="columns">+ поле</button>
                <span class="ex-zone-n" data-count="columns"></span></div>
              <div class="ex-zone-body" data-body="columns"></div>
            </div>
            <div class="ex-zone ex-card" data-zone="measures">
              <div class="ex-zone-h"><span class="ex-cap">ПОКАЗАТЕЛИ</span>
                <button type="button" class="ex-btn ex-zone-add" data-add="measures">+ поле</button>
                <span class="ex-zone-n" data-count="measures"></span></div>
              <div class="ex-zone-body" data-body="measures"></div>
            </div>
            <div class="ex-zone ex-card" data-zone="filters">
              <div class="ex-zone-h"><span class="ex-cap">ФИЛЬТРЫ</span>
                <button type="button" class="ex-btn ex-zone-add" data-add="filters">+ поле</button>
                <span class="ex-zone-n" data-count="filters"></span></div>
              <div class="ex-zone-body" data-body="filters"></div>
            </div>
          </div>

          <!-- Загрузка, ошибка и пустой ответ — одно место: страница не остаётся молча пустой.
               Пока отчёт не построен или строится — куб OLAP со схемой раскладки (cube.js). -->
          <div class="ex-msg ex-card" id="exMsg">
            <div id="exCube"></div>
            <div class="ex-msg-main"><div class="ex-msg-body" id="exMsgBody"></div>
              <div class="ex-cube-legend" id="exCubeLegend"></div></div>
          </div>

          <div class="ex-result ex-card" id="exResult" hidden>
            <div class="ex-result-bar">
              <span class="ex-result-t" id="exResultT"></span>
              <span class="ex-grow"></span>
              <span class="ex-seg" id="exShares" role="group" aria-label="Что показывать в ячейках">
                <button type="button" data-share="none" class="is-on">Значения</button>
                <button type="button" data-share="col">Доля в столбце</button>
                <button type="button" data-share="row">Доля в строке</button>
              </span>
              <button type="button" class="ex-link" id="exExpand">Развернуть всё</button>
              <button type="button" class="ex-link" id="exCollapse">Свернуть</button>
            </div>
            <div class="ex-grid-wrap" id="exGridWrap"></div>
            <div class="ex-more" id="exMore" hidden></div>
            <div class="ex-warnings" id="exWarnings"></div>
            <details class="ex-how" id="exHowBox"><summary>Как считается</summary>
              <div class="ex-how-in" id="exHow"></div></details>
          </div>
        </section>
      </div>
    </div>

    <div class="ex-pop" id="exPop" role="menu" hidden></div>
    <div class="ex-modal-back" id="exModalBack" hidden></div>
    <div class="ex-modal" id="exModal" role="dialog" aria-modal="true" hidden></div>
    <div class="ex-toast" id="exToast" role="status" hidden></div>

    <script type="application/json" id="exBoot">{{ bootstrap | tojson }}</script>
    <script src="/static/js/explorer/grid.js?v={{ app_version }}"></script>
    <script src="/static/js/explorer/cube.js?v={{ app_version }}"></script>
    <script src="/static/js/explorer/page.js?v={{ app_version }}"></script>
    <script src="/static/logo.js"></script>
</body>
</html>
