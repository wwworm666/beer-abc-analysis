<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд - Аналитика план vs факт</title>

    <!-- IBM Plex Mono шрифты -->
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css">

    <!-- CSS Стили (модульный подход) -->
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css">
    <link rel="stylesheet" href="/static/dashboard/styles/tabs.css">
    <link rel="stylesheet" href="/static/dashboard/styles/cards.css">
    <link rel="stylesheet" href="/static/dashboard/styles/charts.css">
    <link rel="stylesheet" href="/static/dashboard/styles/animations.css">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css">
    <link rel="stylesheet" href="/static/dashboard/styles/comparison.css">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css">
    <link rel="stylesheet" href="/static/logo.css">

    <!-- Preload критических JavaScript модулей -->
    <link rel="modulepreload" href="/static/js/dashboard/main.js?v={{ app_version }}">
    <link rel="modulepreload" href="/static/js/dashboard/core/state.js?v={{ app_version }}">
    <link rel="modulepreload" href="/static/js/dashboard/modules/analytics.js?v={{ app_version }}">

    <!-- Chart.js Library (локальная копия для ускорения загрузки) -->
    <script src="/static/libs/chart.umd.min.js"></script>

    <!-- Стандарт периодов (docs/period-standard.md): даты страницы с сервера, общий элемент
         «Период» и выбор бара на весь сайт. Обычные скрипты — до модулей дашборда. -->
    <link rel="stylesheet" href="/static/shared/period.css?v={{ app_version }}">
    <script>window.DASHBOARD_PERIOD = {{ period_config | tojson }};</script>
    <script src="/static/js/shared/period/period_core.js?v={{ app_version }}"></script>
    <script src="/static/js/shared/period/scope.js?v={{ app_version }}"></script>
    <script src="/static/js/shared/period/period_picker.js?v={{ app_version }}"></script>
    <script>KPeriod.configure(window.DASHBOARD_PERIOD);</script>
</head>
<body>

    <!-- Главный layout -->
    {% include 'dashboard/base.html' %}

    <!-- JavaScript модули (ES6 modules) -->
    <script type="module">
        // Версия приложения для кэширования модулей
        const APP_VERSION = "{{ app_version }}";

        // Импортируем главный файл
        import(`/static/js/dashboard/main.js?v=${APP_VERSION}`).then(() => {
            // Сравнение — отдельным модулем. Экспорт отсюда больше не грузится: его уже
            // подключил main.js, а второй адрес (с ?v=) давал второй экземпляр модуля и
            // двойную выгрузку по одному нажатию.
            return import(`/static/js/dashboard/modules/comparison.js?v=${APP_VERSION}`);
        }).then((comparisonMod) => {
            if (comparisonMod && comparisonMod.comparisonModule) {
                comparisonMod.comparisonModule.init();
            }
            console.log('Dashboard loaded successfully');
        }).catch(err => {
            console.error('Error loading dashboard:', err);
        });
    </script>

    <!-- Fallback для старых браузеров -->
    <script nomodule>
        alert('Ваш браузер не поддерживает ES6 модули. Используйте современный браузер.');
    </script>

    <script src="/static/logo.js"></script>
</body>
</html>
