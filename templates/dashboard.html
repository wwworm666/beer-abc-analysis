<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд - Аналитика план vs факт</title>

    <!-- IBM Plex Mono шрифты -->
    <link rel="stylesheet" href="/static/dashboard/styles/fonts.css?v={{ app_version }}">
    <link rel="preload" href="/static/fonts/ibm-plex-mono/IBMPlexMono-Regular.site.woff2" as="font" type="font/woff2" crossorigin>

    <!-- CSS Стили (модульный подход) -->
    <link rel="stylesheet" href="/static/dashboard/styles/variables.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/base.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/tabs.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/cards.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/charts.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/animations.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/sidebar.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/comparison.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/dashboard/styles/mobile.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/logo.css?v={{ app_version }}">

    <!-- Preload критических JavaScript модулей -->
    <link rel="modulepreload" href="/static/js/dashboard/main.js?v={{ app_version }}">
    <link rel="modulepreload" href="/static/js/dashboard/core/state.js?v={{ app_version }}">
    <link rel="modulepreload" href="/static/js/dashboard/modules/analytics.js?v={{ app_version }}">

    <!-- Chart.js Library (локальная копия для ускорения загрузки) -->
    <script src="/static/libs/chart.umd.min.js"></script>

    <!-- Бар и период — общая полоса сайта (templates/shared/scope_strip.html): её стили и
         скрипты (period_core.js, scope.js, period_picker.js, scope_strip.js) подключает общее
         меню в начале страницы, до модулей дашборда; даты страницы — с сервера (core/scope). -->
    <link rel="stylesheet" href="/static/shared/period.css?v={{ app_version }}">
</head>
<body>

    <!-- Главный layout -->
    {% include 'dashboard/base.html' %}

    <!-- JavaScript модули (ES6 modules) -->
    <script type="module">
        // Версия приложения для кэширования модулей
        const APP_VERSION = "{{ app_version }}";

        // Импортируем главный файл
        import(`/static/js/dashboard/main.js?v=${APP_VERSION}`).then(() => {
            // Сравнение — отдельным модулем. Экспорт отсюда больше не грузится: его уже
            // подключил main.js, а второй адрес (с ?v=) давал второй экземпляр модуля и
            // двойную выгрузку по одному нажатию.
            return import(`/static/js/dashboard/modules/comparison.js?v=${APP_VERSION}`);
        }).then((comparisonMod) => {
            if (comparisonMod && comparisonMod.comparisonModule) {
                comparisonMod.comparisonModule.init();
            }
            console.log('Dashboard loaded successfully');
        }).catch(err => {
            console.error('Error loading dashboard:', err);
        });
    </script>

    <!-- Fallback для старых браузеров -->
    <script nomodule>
        alert('Ваш браузер не поддерживает ES6 модули. Используйте современный браузер.');
    </script>

    <script src="/static/logo.js?v={{ app_version }}"></script>
</body>
</html>
